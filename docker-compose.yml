services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tyrelink
      POSTGRES_USER: tyrelink
      POSTGRES_PASSWORD: tyrelink_dev_only
    ports:
      - "5434:5432"
    volumes:
      - tyrelink-postgres:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  tyrelink-postgres:
